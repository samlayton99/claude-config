# pyproject.toml — uv-managed environment (primary). Reproducible via uv.lock.
#
#   uv sync                                      # create .venv + install base deps
#   uv run python -m core.run experiments/<name> # train an experiment (or ./scripts/run.sh)
#   uv add <pkg>                                  # add a dep and update uv.lock
#   uv sync --extra vision                       # pull a task-specific extra
#
# uv installs the Python interpreter too (see requires-python). Put the project
# OUTSIDE any iCloud-synced folder so .venv isn't evicted.

[project]
name = "dl-training"
version = "0.1.0"
description = "Training project scaffolded by dl-trainer"
requires-python = ">=3.10"          # torch.compile / torch.amp need 3.10+
# Base is deliberately minimal — just enough to run core/train.py. Pull the rest
# as extras only when the task needs them.
dependencies = [
    "torch>=2.2",                   # bf16 autocast, fused AdamW, torch.compile
    "numpy",
    "pyyaml",
    "tqdm",                         # progress bars
    "wandb",                        # experiment tracking (logging block); set logging.mode=disabled to no-op
]

[project.optional-dependencies]
# install with: uv sync --extra <name>  (combine: --extra vision --extra sweep)
sweep  = ["gpusweep", "pydrafig"]                    # Roberto09/runner — scripts/sweep.py, utilities/fit_finder.py (both imported)
llm    = ["transformers", "datasets"]
vision = ["timm", "torchvision"]
audio  = ["transformers", "datasets", "torchaudio", "librosa"]
sciml  = ["deepxde", "neuraloperator"]

[tool.uv]
package = false   # this is a project to run, not a library to build/install
# For a specific CUDA build, pin the torch index, e.g.:
#   [[tool.uv.index]]
#   name = "pytorch-cu121"
#   url = "https://download.pytorch.org/whl/cu121"
#   explicit = true
# then under [tool.uv.sources]: torch = { index = "pytorch-cu121" }
