# Audio classification / tagging — AST (Audio Spectrogram Transformer) finetune.
_recipe:
  summary: "AST finetune for audio tagging/classification"
  source: "github.com/YuanGongND/ast (egs/audioset/run.sh, src/dataloader.py)"
  last_verified: 2026-06-25
  adoption: "AST ast-finetuned-audioset ~490k downloads/mo; the plug-in tagger in transformers"
  extra: audio
  todo:
    - "Start from MIT/ast-finetuned-audioset-10-10-0.4593."
    - "Features: 16kHz, 128-mel Kaldi fbank (htk_compat, 25ms window, 10ms shift), 1024 frames."
    - "Normalize (fbank-mean)/(std*2); recompute mean/std per dataset."
    - "SpecAugment: freqm=48, timem=192, mixup=0.5."
    - "Loss: BCEWithLogits for multi-label (AudioSet), CrossEntropy for single-label (ESC-50)."

optim:
  optimizer: adamw
  lr: 1.0e-5
  weight_decay: 5.0e-7
  betas: [0.9, 0.999]
scheduler:
  name: cosine_warmup
  warmup_steps: 1000
train:
  epochs: 25
  amp: true
  amp_dtype: bfloat16
loss:
  name: bce_with_logits   # multi-label; switch to cross_entropy for single-label
