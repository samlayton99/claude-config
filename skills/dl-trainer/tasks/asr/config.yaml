# ASR — Whisper finetuning (seq2seq). Canonical HuggingFace config.
_recipe:
  summary: "Whisper-small finetune for speech-to-text (HF Trainer config)"
  source: "huggingface.co/blog/fine-tune-whisper"
  last_verified: 2026-06-25
  adoption: "Whisper ~104k*; whisper-large-v3 ~5.7M downloads/mo — dominant ASR checkpoint"
  extra: audio
  todo:
    - "Use HF transformers Seq2SeqTrainer with WhisperForConditionalGeneration; model.py unused."
    - "Frontend handled by WhisperFeatureExtractor: 16kHz, 80 mels (128 for large-v3), 30s."
    - "Replace padded label token ids with -100; strip leading BOS in the collator."
    - "SpecAugment optional; Whisper is not streaming — chunk long audio."
    - "Per-size LR: tiny 3.75e-5, base 2.5e-5, small..large-v3 1e-5."

optim:
  optimizer: adamw
  lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0
scheduler:
  name: cosine_warmup   # HF blog uses linear warmup+decay; warmup 500 steps
  warmup_steps: 500
  min_lr: 0.0
data:
  batch_size: 16
train:
  max_steps: 5000
  amp: true
  amp_dtype: float16    # Whisper finetune uses fp16 + gradient_checkpointing
loss:
  name: cross_entropy
  ignore_index: -100
