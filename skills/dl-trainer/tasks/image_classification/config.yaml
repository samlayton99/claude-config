# Image classification from scratch — ConvNeXt-T 300-epoch recipe.
_recipe:
  summary: "ConvNeXt-T from scratch on ImageNet-1k (300-epoch standard)"
  source: "arxiv.org/abs/2201.03545 ; timm configs (github.com/huggingface/pytorch-image-models)"
  last_verified: 2026-06-25
  adoption: "timm ~37k*, v1.0.27 May 2026; ConvNeXt is the default modern ConvNet"
  extra: vision
  todo:
    - "Prefer running timm train.py directly with the official YAML; this is the config mirror."
    - "Aug: RandAugment m9-mstd0.5, Mixup 0.8, CutMix 1.0, Random Erasing p=0.25."
    - "Reg: stochastic depth / drop-path 0.1 (T), LayerScale init 1e-6, weight EMA ~0.9999."
    - "LR scales linearly with batch: lr = 4e-3 * batch/4096."

model:
  name: convnext_tiny
  resolution: 224
  num_classes: 1000     # set to your number of classes
optim:
  optimizer: adamw
  lr: 4.0e-3           # at batch 4096; scale by batch/4096
  weight_decay: 0.05
  betas: [0.9, 0.999]
  grad_clip_norm: null
scheduler:
  name: cosine_warmup
  warmup_steps: 20      # epochs of warmup (convert to steps for cosine_warmup)
  min_lr: 1.0e-5
data:
  batch_size: 1024      # 4096 in the paper; scale LR accordingly
train:
  epochs: 300
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.9999     # weight EMA (now supported by core/train.py); eval/checkpoint use it
loss:
  name: cross_entropy
  label_smoothing: 0.1
