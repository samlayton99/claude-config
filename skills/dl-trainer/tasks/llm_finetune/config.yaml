# LLM supervised finetuning with LoRA. Source of truth for the optimizer/LR.
# The model itself comes from HF transformers + peft, not model.py.
_recipe:
  summary: "LLM SFT via LoRA (TRL/PEFT) — 'LoRA Without Regret' config"
  source: "huggingface.co/docs/trl/lora_without_regret ; thinkingmachines.ai/blog/lora"
  last_verified: 2026-06-25
  adoption: "TRL ~16k* / PEFT ~19k*; reproduced as official TRL guide (Schulman et al., 2025)"
  extra: llm
  todo:
    - "Use TRL `sft.py --use_peft`; this scaffold's model.py is not used for LLMs."
    - "lora_r=256 (SFT) | 1-32 (RL), lora_alpha=16, lora_dropout=0.0, target_modules=all-linear"
    - "Keep effective batch < 32 (LoRA tolerates large batch worse than full-FT)."
    - "LoRA LR ~= 10x the full-finetune LR (full-FT would use ~2e-5)."

optim:
  optimizer: adamw
  lr: 2.0e-4          # LoRA SFT; ~10x full-FT LR
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0
scheduler:
  name: cosine_warmup
  warmup_steps: 100
  min_lr: 0.0
train:
  amp: true
  amp_dtype: bfloat16
loss:
  name: cross_entropy
  label_smoothing: 0.0
  ignore_index: -100
