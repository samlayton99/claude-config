# tasks/<task>/config.yaml — verified best-default hyperparameters for ONE task type.
# scaffold.py --task <task> deep-merges this over the scaffold's template config.yaml.
# Keep ONLY the keys that differ from the scaffold defaults; the _recipe block is metadata
# (printed at scaffold time, validated by check_reference.py) and is stripped before merge.

_recipe:
  summary: "<one line: what this task + recipe is>"
  source: "<primary repo/paper URL(s), ';'-separated>"
  last_verified: 2026-01-01            # ISO date the numbers were confirmed against source
  adoption: "<stars / citations / authors — the verifiable nod>"
  todo:                                # shown to the user after scaffolding (optional)
    - "<any required external step, e.g. 'run the upstream repo, not this loop'>"

# --- hyperparameter overrides (only what differs from the scaffold defaults) ---
# model: {...}
# optim: {optimizer: adamw, lr: 1.0e-3, weight_decay: 0.1}
# scheduler: {name: cosine_warmup, warmup_steps: 100}
# train: {epochs: 100, amp: true}
# loss: {name: cross_entropy}
