# Scientific ML — PINN (physics-informed neural network) via DeepXDE.
_recipe:
  summary: "PINN for forward PDE solving (DeepXDE, Adam->L-BFGS two-stage)"
  source: "github.com/lululxvi/deepxde ; Raissi et al. JCP 2019"
  last_verified: 2026-06-25
  adoption: "DeepXDE ~4.3k*, SIAM Review 2021 (Lu Lu / Karniadakis); canonical PINN lib"
  extra: sciml
  todo:
    - "Host DeepXDE THROUGH core/: core/solve.py runs dde.Model(...).train(), core/problem.py builds geom+PDE+BC. Port, don't bypass. float64 -> pin CPU."
    - "REQUIRED: dde.config.set_default_float('float64') — fp32 stalls L-BFGS."
    - "Net: tanh MLP ~4-6 layers x 20-100 units, Glorot init. ReLU is forbidden."
    - "Train Adam @ 1e-3 for ~15k iters, THEN switch to L-BFGS to convergence."
    - "Sampling: uniform/Hammersley collocation; add RAR for sharp fronts."
    - "If solution is high-frequency: add random Fourier feature input mapping."
    - "Balance PDE/BC/IC/data loss terms (NTK or learning-rate-annealing weights)."

model:
  name: pinn_mlp
  layers: [2, 64, 64, 64, 64, 1]
  activation: tanh
optim:
  optimizer: adam        # stage 1; DeepXDE then runs L-BFGS internally
  lr: 1.0e-3
  weight_decay: 0.0
scheduler:
  name: none
train:
  max_steps: 15000       # Adam iterations before L-BFGS handoff
  amp: false             # float64 — do NOT use AMP for PINNs
loss:
  name: mse              # PDE residual + BC/IC residuals
